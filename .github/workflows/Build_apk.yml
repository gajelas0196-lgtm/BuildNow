name: Build APK2 Native

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        # Pindah ke folder apk2
        cd apk2
        
        # Cari file gradlew (jika posisinya di dalam subfolder, sesuaikan)
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk2-debug
        path: apk2/**/build/outputs/apk/debug/*.apk
